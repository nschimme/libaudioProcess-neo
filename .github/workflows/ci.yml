name: CI Benchmark & Quality Evaluation

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-eval:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout baseline branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || 'main' }}
          path: baseline

      - name: Install toolchains, QEMU & Python tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu \
                                  gcc-riscv64-linux-gnu libc6-dev-riscv64-cross \
                                  qemu-user qemu-user-static python3-pip
          pip3 install --break-system-packages "visqol-python[lattice]" zimtohrli soundfile scipy numpy pandas openpyxl || true

      - name: Cache TCD-VoIP Dataset Archive
        uses: actions/cache@v4
        with:
          path: candidate/data/tcd_voip
          key: tcd-voip-harte2015tcd-v1

      - name: Run Unit Tests with Guard Rails (x86_64)
        run: |
          cd candidate
          make test

      - name: Build & Run Native x86_64 Baseline vs Candidate Benchmark
        run: |
          # Build native candidate shared library
          cd candidate
          make clean
          make CROSS_COMPILE=
          cp libaudioProcess.so ../libaudioProcess_candidate_native.so
          make bench

          # Build native baseline shared library
          cd ../baseline
          make clean
          make CROSS_COMPILE= CFLAGS="-std=c11 -D_GNU_SOURCE -Os -Wall -Wextra -Werror=implicit-function-declaration -fPIC -DWEBRTC_POSIX -Isrc -ffunction-sections -fdata-sections -flto -fno-asynchronous-unwind-tables -fmerge-all-constants -fno-ident"
          cp libaudioProcess.so ../libaudioProcess_baseline_native.so

          # Execute native host throughput benchmark
          cd ../candidate
          ./tests/bench_bin ../libaudioProcess_baseline_native.so ../libaudioProcess_candidate_native.so

      - name: Build MIPS Baseline Shared Library
        run: |
          cd baseline
          make clean
          make CROSS_COMPILE=mipsel-linux-gnu- LDFLAGS="-shared -fPIC -Wl,-z,max-page-size=0x1000 -Wl,--gc-sections -Wl,--no-as-needed -lm -lpthread -flto -Wl,--version-script=src/libaudioProcess.map"
          cp libaudioProcess.so ../libaudioProcess_baseline_mips.so

      - name: Build MIPS Candidate Shared Library
        run: |
          cd candidate
          make clean
          make CROSS_COMPILE=mipsel-linux-gnu- size
          cp libaudioProcess.so ../libaudioProcess_candidate_mips.so

      - name: Run MIPS Baseline vs Candidate Throughput Benchmark (QEMU)
        run: |
          cd candidate
          mipsel-linux-gnu-gcc -std=c11 -D_GNU_SOURCE -Isrc -O2 tests/bench_and_test.c -Wl,--no-as-needed -lm -ldl -o tests/bench_mips
          qemu-mipsel -E LD_PRELOAD=/usr/mipsel-linux-gnu/lib/libm.so.6 -L /usr/mipsel-linux-gnu ./tests/bench_mips ../libaudioProcess_baseline_mips.so ../libaudioProcess_candidate_mips.so

      - name: Run TCD-VoIP & ViSQOL Quality Evaluation (Baseline vs Candidate)
        run: |
          cd candidate
          make process_wav
          python3 scripts/eval_quality_tcd.py ../libaudioProcess_baseline_mips.so ../libaudioProcess_candidate_mips.so
